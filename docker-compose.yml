# Local development infrastructure for the server.
#   docker compose up -d                          # Postgres + RustFS
#   cp .env.example .env && set -a && . ./.env    # export the vars the server requires
#   ./gradlew :server:app:run                     # runs Flyway, then boots against compose
# scripts/dev-stack.sh does all of it.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage, so the BlobStore interface works locally exactly as in prod.
  # Credentials and bucket come from .env (compose reads it), defaulting to .env.example's values.
  # Console at http://localhost:9001/rustfs/console/ with the same credentials.
  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-template}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-template12345}
      RUSTFS_CONSOLE_ENABLE: "true"
      # Empty sends logs to stdout (docker compose logs) instead of files inside the container.
      RUSTFS_OBS_LOG_DIRECTORY: ""
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the bucket once RustFS is healthy, so blobs work with zero manual setup. Bucket
  # provisioning is an infra/ops concern, not the app's — the server never creates buckets. Signs
  # the CreateBucket call with curl's built-in SigV4; a 409 means the bucket already exists. Runs to
  # completion and exits.
  rustfs-init:
    image: rustfs/rustfs:1.0.4
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      status=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT
      --aws-sigv4 'aws:amz:us-east-1:s3'
      --user '${S3_ACCESS_KEY:-template}:${S3_SECRET_KEY:-template12345}'
      http://rustfs:9000/${S3_BUCKET:-blobs}) &&
      echo \"CreateBucket: HTTP $$status\" &&
      case $$status in 200|409) ;; *) exit 1 ;; esac
      "

volumes:
  postgres-data:
  rustfs-data:
