# Local development infrastructure for the server.
#   docker compose up -d        # Postgres + MinIO
#   ./gradlew :server:app:run   # runs Flyway, then boots — works with zero config (localhost defaults)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage, so the BlobStore interface works locally exactly as in prod.
  # Console at http://localhost:9001 (minio / minio12345).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the default bucket (S3_BUCKET) once MinIO is healthy, so blobs work with zero manual
  # setup. Bucket provisioning is an infra/ops concern, not the app's — the server never creates
  # buckets. Runs to completion and exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio12345 &&
      mc mb --ignore-existing local/blobs
      "

volumes:
  postgres-data:
  minio-data:
