ktor-client-resources = { module = "io.ktor:ktor-client-resources", version.ref = "ktor" }

# Shared seam (rationed dependency surface)
ktor-resources = { module = "io.ktor:ktor-resources", version.ref = "ktor" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

# Platform-secure key/value storage (OS keystore-backed: Keychain / Keystore / encrypted file)
ksafe = { module = "eu.anifantakis:ksafe", version.ref = "ksafe" }

# Ktor server
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
