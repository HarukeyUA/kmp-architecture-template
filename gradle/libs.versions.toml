junit = "4.13.2"

assertk = "0.28.1"
turbine = "1.2.1"

spotless = "8.8.0"
ktfmt = "0.63"

# Server
exposed = "1.3.0"
hikari = "7.0.2"
postgresql = "42.7.11"
