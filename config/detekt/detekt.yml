config:
  validation: true
  warningsAsErrors: false

comments:
  OutdatedDocumentation:
    active: true
  DocumentationOverPrivateFunction:
    active: true
  DocumentationOverPrivateProperty:
    active: true
  KDocReferencesNonPublicProperty:
    active: true

complexity:
  CognitiveComplexMethod:
    active: true
    allowedComplexity: 18
  CyclomaticComplexMethod:
    allowedComplexity: 22
    ignoreSingleWhenExpression: true
  ComplexInterface:
    active: true
    allowedDefinitions: 8
  LongMethod:
    active: true
    allowedLines: 80
  LongParameterList:
    active: true
    allowedFunctionParameters: 8
    allowedConstructorParameters: 8
    ignoreDefaultParameters: true
    # Injected constructors and composable slots are wiring width, not logic width.
    ignoreAnnotated:
      - Inject
      - AssistedInject
      - Composable
    excludes:
      - "**/src/*Test/**"
      - "**/src/androidTest/**"
      - "**/src/test/**"
      - "**/testing/**"
      - "**/*-testing/**"
  TooManyFunctions:
    active: true
    allowedFunctionsPerFile: 16
    allowedFunctionsPerClass: 12
    allowedFunctionsPerInterface: 8
    ignoreAnnotatedFunctions:
      - Preview
    excludes:
      - "**/src/*Test/**"
      - "**/src/androidTest/**"
      - "**/src/test/**"

coroutines:
  GlobalCoroutineUsage:
    active: true
  InjectDispatcher:
    active: true
    excludes:
      - "**/core/dispatchers/impl/src/**"
      - "**/src/*Test/**"
      - "**/src/androidTest/**"
      - "**/src/test/**"
      - "**/testing/**"
      - "**/*-testing/**"
  SuspendFunInFinallySection:
    active: true
  SuspendFunSwallowedCancellation:
    active: true

exceptions:
  NotImplementedDeclaration:
    active: true
  ObjectExtendsThrowable:
    active: true
  TooGenericExceptionCaught:
    active: true
  TooGenericExceptionThrown:
    active: true

naming:
  FunctionNaming:
    functionPattern: "[a-zA-Z][a-zA-Z0-9]*"
    excludes:
      - "**/src/*Test/**"
      - "**/src/androidTest/**"
      - "**/src/test/**"
  MatchingDeclarationName:
    active: false
  TopLevelPropertyNaming:
    constantPattern: "[A-Z][A-Za-z0-9_]*"

potential-bugs:
  MissingUseCall:
    active: true
    excludes:
      - "**/src/*Test/**"
      - "**/src/androidTest/**"
      - "**/src/test/**"
      - "**/testing/**"
      - "**/*-testing/**"
  NullableToStringCall:
    active: true
  CastNullableToNonNullableType:
    active: true
    excludes:
      - "**/src/*Test/**"
      - "**/src/androidTest/**"
      - "**/src/test/**"
      - "**/testing/**"
      - "**/*-testing/**"
  MapGetWithNotNullAssertionOperator:
    excludes:
      - "**/src/*Test/**"
      - "**/src/androidTest/**"
      - "**/src/test/**"
      - "**/testing/**"
      - "**/*-testing/**"
  UnsafeCallOnNullableType:
    excludes:
      - "**/src/*Test/**"
      - "**/src/androidTest/**"
      - "**/src/test/**"
      - "**/testing/**"
      - "**/*-testing/**"
  CastToNullableType:
    active: true
  DontDowncastCollectionTypes:
    active: true
  ElseCaseInsteadOfExhaustiveWhen:
    active: true

style:
  AbstractClassCanBeConcreteClass:
    excludes:
      - "**/src/*Test/**"
      - "**/src/androidTest/**"
      - "**/src/test/**"
      - "**/testing/**"
      - "**/*-testing/**"
  AlsoCouldBeApply:
    active: true
  CanBeNonNullable:
    active: true
  DoubleNegativeLambda:
    active: true
  ForbiddenMethodCall:
    active: true
    methods:
      - reason: "Use the logger; stdout is invisible on Android and iOS."
        value: "kotlin.io.println"
      - reason: "Use the logger; stdout is invisible on Android and iOS."
        value: "kotlin.io.print"
    excludes:
      - "**/src/*Test/**"
      - "**/src/androidTest/**"
      - "**/src/test/**"
      - "**/testing/**"
      - "**/*-testing/**"
  UseCheckOrError:
    excludes:
      - "**/src/*Test/**"
      - "**/src/androidTest/**"
      - "**/src/test/**"
      - "**/testing/**"
      - "**/*-testing/**"
  UseCheckNotNull:
    excludes:
      - "**/src/*Test/**"
      - "**/src/androidTest/**"
      - "**/src/test/**"
      - "**/testing/**"
      - "**/*-testing/**"
  UnnecessaryLet:
    active: true
  UnusedPrivateFunction:
    ignoreAnnotated:
      - Preview
  UseIfInsteadOfWhen:
    active: true
  DataClassContainsFunctions:
    active: true
  DataClassShouldBeImmutable:
    active: true
  ForbiddenComment:
    active: true
    comments:
      - reason: "TODO markers should be tracked outside production code."
        value: TODO
  MagicNumber:
    active: false
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  MaxLineLength:
    active: false
  ReturnCount:
    active: false

performance:
  UnnecessaryInitOnArray:
    active: true
