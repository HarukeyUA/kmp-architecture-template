name: Release

# Manual-only. Builds the prod artifacts and attaches them to one GitHub Release:
#   - Android: an APK, signed when the ANDROID_* secrets are set and unsigned otherwise
#   - macOS:   an unsigned arm64 DMG, ProGuard-shrunk (expect a Gatekeeper warning on first open)
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which artifacts to build"
        type: choice
        default: both
        options:
          - both
          - android
          - macos

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android:
    name: Android prod release APK
    if: ${{ inputs.platforms == 'both' || inputs.platforms == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # versionCode is `git rev-list --count HEAD`; a shallow clone would report 1.
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "No keystore secret: the APK stays unsigned."
          fi
      - name: Assemble prod release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :client:androidApp:assembleProdRelease
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: client/androidApp/build/outputs/apk/prod/release/*.apk
          if-no-files-found: error

  macos:
    name: macOS prod DMG (unsigned, arm64)
    if: ${{ inputs.platforms == 'both' || inputs.platforms == 'macos' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          # Corretto still ships the jmods directory, which the Nucleus jlink task needs for
          # `includeAllModules`; Temurin dropped jmods from its JDK 24+ distributions.
          distribution: corretto
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Package DMG
        run: ./gradlew :client:desktopApp:packageReleaseDmg
      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: client/desktopApp/build/compose/binaries/main-release/dmg/*.dmg
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [android, macos]
    # A deselected platform's job is skipped, which must not skip publishing the other one.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create the release and attach the artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="release-${{ github.run_number }}"
          # On a re-run the tag already exists, so fall back to re-uploading the assets.
          gh release create "$tag" artifacts/* \
            --target "$GITHUB_SHA" \
            --title "Build #${{ github.run_number }}" \
            --notes "Automated prod build from ${GITHUB_SHA::7}." \
            || gh release upload "$tag" artifacts/* --clobber
